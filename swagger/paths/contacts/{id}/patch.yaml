tags:
  - Contacts
summary: Update a contact
operationId: updateContact
description: Update the information of an existing contact by its ID for the authenticated user.
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
    description: The ID of the contact to update.
    example: 66d8a5c741ff9f93fd2d663f
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            description: The updated name of the contact.
          email:
            type: string
            description: The updated email of the contact.
          phone:
            type: string
            description: The updated phone number of the contact.
          contactType:
            type: string
            enum: [work, home, personal]
            description: The updated type of the contact.
          isFavourite:
            type: boolean
            description: Indicates if the contact is marked as favourite or not.
        required:
          - name
          - email
          - phone
responses:
  '200':
    description: Successfully patched the contact.
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched the contact!
            data:
              $ref: ../../../components/schemas/contact.yaml
  '400':
    $ref: ../../../components/responses/400.yaml
  '401':
    $ref: ../../../components/responses/401.yaml
  '404':
    $ref: ../../../components/responses/404.yaml
  '500':
    $ref: ../../../components/responses/500.yaml
