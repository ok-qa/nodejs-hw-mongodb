tags:
  - Contacts
summary: Create contact
operationId: createContact
description: 'Create a contact'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - isFavourite
          - contactType
        properties:
          name:
            description: 'Contact's name'
            type: string
            example: 'Arthur Stocker'
          phoneNumber:
            description: 'Contact's phonenumber'
            type: number
            example: '+12061112233'
          email:
            description: 'Contact's email'
            type: string
            example: 'astocker05@gmail.com'
            default: undefined
          isFavourite:
            description: 'Contact is favourite'
            type: boolean
            example: 'false'
          contactType:
            description: 'Type of contact'
            type: string
            enum: ['work', 'home', 'personal']
            example: 'personal'
          photo:
            description: 'Contacts photo'
            type: string
            format: binary
            default: null
responses:
  '201':
    description: 'Created a contact'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: 'Successfully created a contact'
            data:
              $ref: ../../components/schemas/contact.yaml
  '401':
    $ref: ..\..\components\responses\401.yaml
